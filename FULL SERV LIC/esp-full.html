['ush-001','УСХ-КР-001','Ремонт крана-штабелера','USH','lifting','Кран-штабелер','КШ-20',72,3,'5 разряд',5,'safety','ФНП Подъёмные сооружения','ФНП',0.92,'КР',76,'Кран-балка','Ограждение',''],

['bld-001','ЗД-КР-001','Ремонт кровли цеха','BLD','building','Кровля','КР-ЦЕХ',120,5,'4-5 разряд',3,'federal','ФЕР-2001','ФЕР',0.90,'ТР',126,'Сварочный','Наряд-допуск',''],
['lft-001','ПС-МК-001','Замена канатов мостового крана','LIFT','lifting','Мостовой кран','Кран 100/20т',32,4,'4-5 разряд',4,'safety','ФНП Подъёмные сооружения','ФНП',0.95,'СР',30,'Лебёдка','Ограждение','1201-001-009-001-001-001-001']
];
// (В реальном коде здесь все 112 записей, я оставил 10 для примера, чтобы код влез в ответ. 
//  Если нужно, я могу выдать полный массив отдельно, но структура уже готова.)

const BASE_NORMS = N_RAW.map(r => ({
  id:r[0], operationCode:r[1], operationName:r[2], section:r[3], equipmentCategory:r[4],
  equipmentType:r[5], equipmentUnit:r[6], normValue:r[7], unit:'чел-час', teamSize:r[8],
  qualification:r[9], complexity:r[10], sourceType:r[11], sourceCode:r[12], sourceTitle:r[13],
  confidenceLevel:r[14], repairType:r[15], actualAvg:r[16],
  toolsRequired:(r[17]||'').split(',').map(s=>s.trim()).filter(Boolean),
  safetyRequirements:(r[18]||'').split(',').map(s=>s.trim()).filter(Boolean),
  description:'', tm:r[19]||'', deviationPct:0
}));
</script>

<!-- ═══ UI И ЛОГИКА ═══ -->
<script>
'use strict';
const { Auth, Storage, Utils } = ESP;
const state = {
  tab: 'normatives', search: '', fSection: '', fCat: '', fRep: '',
  calc: [], cards: Array.isArray(Storage.get('cards', [])) ? Storage.get('cards', []) : [],
  custom: Array.isArray(Storage.get('custom', [])) ? Storage.get('custom', []) : [],
  customEquip: Array.isArray(Storage.get('equip', [])) ? Storage.get('equip', []) : []
};
const SECTION_NAMES = {'UPSMiF':'УПСМиФ','DSP':'ДСП','UPK':'УПК','UVD':'УВД','ONLZ':'ОНЛЗ','USH':'УСХиОЗ','UOR':'УОРСиШК','BLD':'Здания','ABK':'АБК','LIFT':'Подъёмные'};
const CATEGORY_NAMES = {mechanical:'Механическое',energy:'Энергетическое',hydraulic:'Гидравлическое',electric:'Электрическое',lifting:'Подъёмные',refractory:'Огнеупорное',building:'Строительные'};
const REPAIR_NAMES = {'ТР':'Текущий','СР':'Средний','КР':'Капитальный'};
const ROLE_NAMES = {admin:'Администратор',engineer:'Инженер',user:'Пользователь'};

function allNorms(){ return [...BASE_NORMS, ...state.custom]; }

function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginForm').reset();
  document.getElementById('loginError').classList.remove('show');
}
function showApp(){
  try {
    const loginScreen = document.getElementById('loginScreen');
    const app = document.getElementById('app');
    if (loginScreen) loginScreen.style.display = 'none';
    if (app) {
      app.classList.remove('hidden');
      app.style.display = 'grid';
      app.style.height = '100dvh';
    }
    renderUserBadge(); renderNav(); renderChat();
  } catch(e) { console.error(e); }
}
function doLogout(){ Auth.logout(); showLogin(); }
function renderUserBadge(){
  const s = Auth.current();
  if(!s) return;
  document.getElementById('userBadge').innerHTML = '<div class="user-avatar">' + s.name[0] + '</div><div>' + s.name + '</div>';
}

function renderNav(){
  const nav = document.getElementById('navScroll');
  const role = Auth.current()?.role || 'user';
  const items = [
    {id:'normatives', label:'Нормативы', ico:'🔍'},
    {id:'calculator', label:'Калькулятор', ico:'🧮'},
    {id:'cards', label:'Тех. карты', ico:'📄'},
    {id:'statistics', label:'Статистика', ico:'📊'},
    {id:'add', label:'Добавить норматив', ico:'➕'},
    {id:'workflow', label:'Согласование', ico:'✓'},
    {id:'versions', label:'Версии', ico:'🔖'}
  ];
  nav.innerHTML = '<div class="nav-section"><div class="nav-section-title">Работа</div>' + items.map(it => {
    return '<div class="nav-item ' + (state.tab===it.id?'active':'') + '" data-nav="' + it.id + '"><span class="ico">' + it.ico + '</span><span>' + it.label + '</span></div>';
  }).join('') + '</div>';
  nav.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => {
      state.tab = el.dataset.nav;
      document.getElementById('sidebar').classList.remove('open');
      renderNav(); renderChat();
    };
  });
}

function renderChat(){
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  const titles = {normatives:'Нормативы', calculator:'Калькулятор', cards:'Тех. карты', statistics:'Статистика', add:'Добавить', workflow:'Согласование', versions:'Версии'};
  document.getElementById('topbarTitle').textContent = titles[state.tab] || 'Full';
  if (state.tab === 'normatives') tabNormatives();
  else if (state.tab === 'calculator') tabCalculator();
  else if (state.tab === 'cards') tabCards();
  else if (state.tab === 'statistics') tabStatistics();
  else if (state.tab === 'add') tabAdd();
  else if (state.tab === 'workflow') tabWorkflow();
  else if (state.tab === 'versions') tabVersions();
}

function appendMsg(html){
  const chat = document.getElementById('chat');
  chat.innerHTML = '<div class="bubble">' + html + '</div>';
}

/* ═══ РАЗДЕЛЫ ═══ */
function tabNormatives(){
  const list = allNorms().filter(n => {
    const s = state.search.toLowerCase();
    return (!s || n.operationName.toLowerCase().includes(s) || n.operationCode.toLowerCase().includes(s)) &&
           (!state.fSection || n.section === state.fSection);
  });
  appendMsg(`
    <div class="bubble-title">🔍 База нормативов</div>
    <div class="bubble-sub">Найдено: ${list.length} из ${allNorms().length}</div>
    <div class="form-group"><input class="search-inp" id="srch" placeholder="Поиск..." value="${Utils.esc(state.search)}"></div>
    <div class="form-group"><select class="sel" id="f-sec"><option value="">Все участки</option>${Object.entries(SECTION_NAMES).map(([k,v])=>`<option value="${k}" ${state.fSection===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div style="display:flex;flex-direction:column;gap:8px">${list.map(n => `
      <div class="norm-row">
        <div class="norm-row-head">
          <div class="norm-row-info">
            <div class="norm-row-code">${n.operationCode}</div>
            <div class="norm-row-name">${n.operationName}</div>
            <div class="norm-row-eq">${SECTION_NAMES[n.section]||''} • ${n.equipmentType}</div>
          </div>
          <div class="norm-row-stats">
            <div class="norm-stat"><div class="norm-stat-v">${n.normValue}</div><div class="norm-stat-l">ч/ч</div></div>
          </div>
        </div>
        <div class="norm-row-actions">
          <button class="btn btn-primary btn-xs" data-add="${n.id}">+ В расчёт</button>
        </div>
      </div>
    `).join('')}</div>
  `);
  document.getElementById('srch').oninput = e => { state.search = e.target.value; tabNormatives(); };
  document.getElementById('f-sec').onchange = e => { state.fSection = e.target.value; tabNormatives(); };
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const id = b.dataset.add;
    if(!state.calc.find(c => c.norm.id === id)) state.calc.push({norm: allNorms().find(n=>n.id===id), qty:1});
    b.className = 'btn btn-success btn-xs'; b.textContent = '✓ Добавлено';
  });
}

function tabCalculator(){
  const total = state.calc.reduce((s,i) => s+i.norm.normValue*i.qty, 0);
  appendMsg(`
    <div class="bubble-title">🧮 Калькулятор</div>
    <div class="bubble-sub">В расчёте: ${state.calc.length} операций</div>
    ${!state.calc.length ? '<div style="text-align:center;padding:20px;color:#94a3b8">Список пуст</div>' : state.calc.map((it, idx) => `
      <div class="norm-row" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="norm-row-name">${it.norm.operationName}</div>
          <div class="norm-row-eq">${it.norm.normValue} × ${it.qty} = <b style="color:#fdba74">${it.norm.normValue*it.qty}</b> ч/ч</div>
        </div>
        <button class="btn btn-danger btn-xs" data-rm="${idx}">✕</button>
      </div>
    `).join('')}
    <div class="tile" style="margin-top:10px;text-align:center">
      <div class="tile-h">Итого трудозатрат</div>
      <div class="tile-v orange">${total} <span style="font-size:12px;color:#94a3b8">чел-час</span></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-success" id="btnCreateCard" style="flex:1">📄 Создать техкарту</button>
    </div>
  `);
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { state.calc.splice(b.dataset.rm, 1); tabCalculator(); });
  const btn = document.getElementById('btnCreateCard');
  if(btn) btn.onclick = () => {
    if(!state.calc.length) return alert('Список пуст');
    const total = state.calc.reduce((s,i) => s+i.norm.normValue*i.qty, 0);
    const card = { id: Date.now().toString(), cardNumber: 'ТК-' + Date.now().toString().slice(-4), equipmentName: 'Оборудование ЭСПЦ', totalHours: total, operations: state.calc.map(i=>({normativeId:i.norm.id, quantity:i.qty})), createdAt: new Date().toISOString() };
    state.cards.push(card); Storage.set('cards', state.cards);
    state.calc = []; state.tab = 'cards'; renderNav(); renderChat();
    alert('Техкарта создана!');
  };
}

function tabCards(){
  appendMsg(`
    <div class="bubble-title">📄 Технологические карты</div>
    ${!state.cards.length ? '<div style="text-align:center;padding:20px;color:#94a3b8">Нет сохранённых карт</div>' : state.cards.map(c => `
      <div class="norm-row">
        <div class="norm-row-code">${c.cardNumber}</div>
        <div class="norm-row-name">${c.equipmentName}</div>
        <div class="norm-row-eq">Трудозатраты: <b style="color:#fdba74">${c.totalHours} ч/ч</b></div>
        <div class="norm-row-actions">
          <button class="btn btn-danger btn-xs" data-del="${c.id}">Удалить</button>
        </div>
      </div>
    `).join('')}
  `);
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.cards = state.cards.filter(c => c.id !== b.dataset.del);
    Storage.set('cards', state.cards); tabCards();
  });
}

function tabStatistics(){
  appendMsg(`
    <div class="bubble-title">📊 Статистика</div>
    <div class="grid2">
      <div class="tile"><div class="tile-h">Всего нормативов</div><div class="tile-v blue">${allNorms().length}</div></div>
      <div class="tile"><div class="tile-h">Своих добавлено</div><div class="tile-v green">${state.custom.length}</div></div>
    </div>
  `);
}

function tabAdd(){
  appendMsg(`
    <div class="bubble-title">➕ Новый норматив</div>
    <div class="form-group"><label class="form-lbl">Наименование</label><input class="form-inp" id="add-name" placeholder="Замена детали..."></div>
    <div class="form-group"><label class="form-lbl">Норматив (чел-час)</label><input class="form-inp" type="number" id="add-val" value="10"></div>
    <button class="btn btn-orange" id="btn-save" style="width:100%;padding:12px">Сохранить</button>
  `);
  document.getElementById('btn-save').onclick = () => {
    const name = document.getElementById('add-name').value;
    const val = parseFloat(document.getElementById('add-val').value);
    if(!name || !val) return alert('Заполните поля');
    state.custom.push({ id: 'c-'+Date.now(), operationCode: 'НОВ-'+Date.now().toString().slice(-3), operationName: name, normValue: val, section: 'UPSMiF', equipmentCategory: 'mechanical', equipmentType: 'Ручная', teamSize: 1, unit: 'чел-час', confidenceLevel: 0.8 });
    Storage.set('custom', state.custom);
    alert('Норматив добавлен!');
    state.tab = 'normatives'; renderNav(); renderChat();
  };
}

function tabWorkflow(){ appendMsg('<div class="bubble-title">✓ Согласование</div><div style="color:#94a3b8;padding:20px;text-align:center">Модуль в разработке (требуется подключение сервера)</div>'); }
function tabVersions(){ appendMsg('<div class="bubble-title">🔖 Версии</div><div style="color:#94a3b8;padding:20px;text-align:center">История изменений доступна только для авторизованных пользователей</div>'); }

/* ═══ ИНИЦИАЛИЗАЦИЯ ═══ */
ESP_GUARD.init();

// Обработчик входа
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  const l = document.getElementById('loginInput').value.trim();
  const p = document.getElementById('passwordInput').value;
  const sess = await Auth.login(l, p);
  if(sess) {
    showApp();
  } else {
    const err = document.getElementById('loginError');
    err.classList.add('show');
    document.getElementById('passwordInput').value = '';
    setTimeout(() => err.classList.remove('show'), 2500);
  }
};

// Демо-доступы (inline onclick, работает даже при сбоях JS)
document.querySelectorAll('.login-account').forEach(el => {
  el.onclick = () => {
    document.getElementById('loginInput').value = el.dataset.login;
    document.getElementById('passwordInput').value = el.dataset.pwd;
    document.getElementById('loginError').classList.remove('show');
  };
});

// Авто-вход при обновлении
if(Auth.current()) {
  showApp();
} else {
  showLogin();
}
</script>
</body>
</html>
