/* ═══ BASE ═══ */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {

  --panel: #1a2233;

html, body {

  overflow-x: hidden;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

  color: var(--fg);
  font-size: 14px;

  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
button, input, select, textarea { font-family: inherit; }
a { color: var(--accent); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; background: #0a0f1a; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
.muted { color: var(--muted); }
.center { text-align: center; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }

/* ═══ BUTTONS / INPUTS ═══ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--panel2);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover { background: #2d3a55; border-color: #3f4d6e; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2563eb; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #062b13; }
.btn.err { background: var(--err); border-color: var(--err); color: #fff; }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  background: #0d1422;
  border: 1px solid var(--line);
  color: var(--fg);
  padding: 8px 10px;
  border-radius: 6px;
  outline: none;
  font-size: 13px;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

/* ═══ LOGIN ═══ */

      h ^= str.charCodeAt(i)

      }
      /* FNV 10 000 раундов — детерминированно, слабее, но работает везде */

/* ═══════════════════════════════════════════════════════════════════
   RENDER: Нормативы
   ═══════════════════════════════════════════════════════════════════ */
function filteredNorms () {
  const q = state.filter.q.trim().toLowerCase()
  return NORMS.filter(n => {
    if (state.filter.section && n.section !== state.filter.section) return false
    if (state.filter.category && n.category !== state.filter.category) return false
    if (q) {
      const hay = (n.tm + ' ' + n.name + ' ' + n.equipment + ' ' + n.category).toLowerCase()
      if (hay.indexOf(q) === -1) return false
    }
    return true
  })
}

function tabNorms () {
  const list = filteredNorms()
  const secOpts = DICT.sections.map(s =>
    '<option value="' + s.code + '"' + (state.filter.section === s.code ? ' selected' : '') + '>' +
    Utils.escapeHtml(s.name) + '</option>').join('')
  const catOpts = DICT.categories.map(c =>
    '<option value="' + c + '"' + (state.filter.category === c ? ' selected' : '') + '>' +
    Utils.escapeHtml(c) + '</option>').join('')

  const rows = list.map(n => {
    return '<tr>' +
      '<td><span class="tm">' + Utils.escapeHtml(n.tm) + '</span></td>' +
      '<td>' + Utils.escapeHtml(n.name) +
        '<div class="muted" style="font-size:11px">' + Utils.escapeHtml(n.equipment) + ' · ' + Utils.escapeHtml(n.category) + '</div>' +
      '</td>' +
      '<td>' + Utils.escapeHtml(n.section) + '</td>' +
      '<td class="center">' + Utils.fmtNorm(n.norm) + '</td>' +
      '<td class="muted">' + Utils.escapeHtml(n.unit) + '</td>' +
    '</tr>'
  }).join('')

  return '' +
    '<h2>📋 Нормативы <span class="count-badge">' + list.length + ' / ' + NORMS.length + '</span></h2>' +
    '<div class="card">' +
      '<div class="toolbar">' +
        '<input type="text" id="f-q" placeholder="Поиск: ТМ, наименование, оборудование…" value="' + Utils.escapeHtml(state.filter.q) + '">' +
        '<select id="f-sec"><option value="">Все участки</option>' + secOpts + '</select>' +
        '<select id="f-cat"><option value="">Все категории</option>' + catOpts + '</select>' +
        '<button class="btn sm" id="f-reset">Сбросить</button>' +
      '</div>' +
      '<div style="overflow-x:auto">' +
      '<table>' +
        '<thead><tr>' +
          '<th>ТМ-код</th><th>Наименование</th><th>Участок</th>' +
          '<th class="center">Норма</th><th>Ед.</th>' +
        '</tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="5" class="center muted" style="padding:20px">Нет данных</td></tr>') + '</tbody>' +
      '</table>' +
      '</div>' +
    '</div>'
}

function bindNormsEvents () {
  const q = document.getElementById('f-q')
  const sec = document.getElementById('f-sec')
  const cat = document.getElementById('f-cat')
  const rst = document.getElementById('f-reset')
  if (q) q.addEventListener('input', () => { state.filter.q = q.value; rerenderTab(false) })
  if (sec) sec.addEventListener('change', () => { state.filter.section = sec.value; rerenderTab() })
  if (cat) cat.addEventListener('change', () => { state.filter.category = cat.value; rerenderTab() })
  if (rst) rst.addEventListener('click', () => {
    state.filter = { q: '', section: '', category: '' }
    rerenderTab()
  })
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER: Калькулятор
   ═══════════════════════════════════════════════════════════════════ */
function calcSearchList () {
  const q = state.calc.q.trim().toLowerCase()
  let list = NORMS
  if (q) {
    list = NORMS.filter(n =>
      (n.tm + ' ' + n.name + ' ' + n.equipment).toLowerCase().indexOf(q) !== -1
    )
  }
  return list.slice(0, 60)
}

function calcTotal () {
  let total = 0
  state.calc.picked.forEach(p => {
    const n = NORMS.find(x => x.id === p.normId)
    if (!n) return
    total += Number(n.norm) * Number(p.qty || 0)
  })
  return total
}

function tabCalc () {
  const list = calcSearchList()
  const opsHtml = list.map(n =>
    '<div class="op" data-id="' + n.id + '">' +
      '<div class="name">' +
        Utils.escapeHtml(n.name) +
        '<div class="tm">' + Utils.escapeHtml(n.tm) + '</div>' +
      '</div>' +
      '<span class="norm">' + Utils.fmtNorm(n.norm) + '</span>' +
      '<button class="btn sm primary calc-add" data-id="' + n.id + '">+ В расчёт</button>' +
    '</div>'
  ).join('')

  const pickedHtml = state.calc.picked.length
    ? state.calc.picked.map((p, idx) => {
        const n = NORMS.find(x => x.id === p.normId)
        if (!n) return ''
        return '<div class="row">' +
          '<div class="nm">' + Utils.escapeHtml(n.name) +
            '<small>' + Utils.escapeHtml(n.tm) + ' · ' + Utils.fmtNorm(n.norm) + ' чел-час</small>' +
          '</div>' +
          '<input type="number" min="1" step="1" class="calc-qty" data-idx="' + idx + '" value="' + Number(p.qty || 1) + '">' +
          '<button class="btn sm err calc-del" data-idx="' + idx + '" title="Удалить">✕</button>' +
        '</div>'
      }).join('')
    : '<div class="center muted" style="padding:20px">Список пуст.<br>Добавьте операции из левой колонки.</div>'

  const total = calcTotal()

  return '' +
    '<h2>🧮 Калькулятор трудозатрат</h2>' +
    '<div class="calc-grid">' +
      '<div class="card">' +
        '<h3>Выбор операций</h3>' +
        '<div class="toolbar"><input type="text" id="calc-q" placeholder="Поиск операции…" value="' + Utils.escapeHtml(state.calc.q) + '"></div>' +
        '<div class="calc-list" id="calc-list">' + (opsHtml || '<div class="center muted" style="padding:20px">Ничего не найдено</div>') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Расчёт <span class="count-badge">' + state.calc.picked.length + ' поз.</span></h3>' +
        '<div class="calc-picked" id="calc-picked">' + pickedHtml + '</div>' +
        '<div class="calc-total">Итого: <b>' + Utils.fmtNorm(total) + '</b> чел-час</div>' +
        '<div class="row" style="margin-top:10px">' +
          '<button class="btn sm" id="calc-clear">Очистить</button>' +
        '</div>' +
      '</div>' +
    '</div>'
}

function bindCalcEvents () {
  const q = document.getElementById('calc-q')
  if (q) q.addEventListener('input', () => { state.calc.q = q.value; rerenderTab(false) })

  const clr = document.getElementById('calc-clear')
  if (clr) clr.addEventListener('click', () => {
    state.calc.picked = []
    rerenderTab()
  })
}

function bindCalcOpsEvents () {
  const list = document.getElementById('calc-list')
  if (list) {
    list.addEventListener('click', (e) => {
      const btn = e.target.closest('.calc-add')
      if (!btn) return
      const id = Number(btn.dataset.id)
      const exists = state.calc.picked.find(p => p.normId === id)
      if (exists) { exists.qty = Number(exists.qty) + 1 }
      else { state.calc.picked.push({ normId: id, qty: 1 }) }
      rerenderTab()
    })
  }

  const picked = document.getElementById('calc-picked')
  if (picked) {
    picked.addEventListener('input', (e) => {
      const qty = e.target.closest('.calc-qty')
      if (!qty) return
      const idx = Number(qty.dataset.idx)
      if (state.calc.picked[idx]) {
        state.calc.picked[idx].qty = Number(qty.value) || 0
        // обновляем только итог, без полного ререндера
        const t = document.querySelector('.calc-total b')
        if (t) t.textContent = Utils.fmtNorm(calcTotal())
      }
    })
    picked.addEventListener('click', (e) => {
      const del = e.target.closest('.calc-del')
      if (!del) return
      const idx = Number(del.dataset.idx)
      state.calc.picked.splice(idx, 1)
      rerenderTab()
    })
  }
}

function attachCalcEvents () {
  bindCalcOpsEvents()
  bindCalcEvents()
}

function renderNav () {
  const nav = document.getElementById('sb-nav')
  nav.innerHTML = TABS.map(t =>
    '<div class="item' + (state.tab === t.id ? ' active' : '') + '" data-tab="' + t.id + '">' +
      t.icon + ' ' + t.label +
    '</div>'
  ).join('')
  nav.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      state.tab = el.dataset.tab
      renderNav()
      renderTab()
    })
  })
}

function renderUser () {
  const u = state.user
  const nameEl = document.getElementById('sb-user-name')
  const roleEl = document.getElementById('sb-user-role')
  if (u) {
    nameEl.textContent = u.name
    roleEl.textContent = (u.role === 3 ? 'admin' : u.role === 2 ? 'engineer' : 'user')
  }
}

function renderTab () {
  const fn = TABS_RENDER[state.tab]
  const html = fn ? fn() : '<div class="center muted">Раздел недоступен</div>'
  document.getElementById('tab-content').innerHTML = html

  /* события — перепривязка после innerHTML */
  if (state.tab === 'norms') bindNormsEvents()
  if (state.tab === 'calc') attachCalcEvents()
  if (state.tab === 'about') bindAboutEvents()
}

function rerenderTab (rebuildNav) {
  if (rebuildNav) renderNav()
  renderTab()
}

/* ═══════════════════════════════════════════════════════════════════
   LOGIN FLOW
   ═══════════════════════════════════════════════════════════════════ */
async function doLogin () {
  const login = document.getElementById('in-login').value.trim()
  const pass = document.getElementById('in-pass').value
  const err = document.getElementById('login-err')
  err.textContent = ''

  const sess = await Auth.login(login, pass)
  if (!sess) {
    err.textContent = 'Неверный логин или пароль'
    return
  }
  enterApp(sess)
}

function enterApp (sess) {
  state.user = sess
  document.getElementById('login-screen').style.display = 'none'
  const app = document.getElementById('app')
  app.classList.add('on')
  renderNav()
  renderUser()
  renderTab()
  /* водяной знак в футере */
  const g = window.ESP_GUARD || {}
  const wm = document.getElementById('esp-wm')
  if (wm) wm.textContent = (g.WM || '') + ' · ' + (g.LICENSE_ID || '')
}

function doLogout () {
  Auth.logout()
  state.user = null
  state.calc.picked = []
  document.getElementById('app').classList.remove('on')
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('in-pass').value = ''
  document.getElementById('login-err').textContent = ''
}

/* ═══════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════ */
async function init () {
  await Auth.initDefaults()

  document.getElementById('btn-login').addEventListener('click', doLogin)
  document.getElementById('in-pass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin()
  })
  document.getElementById('in-login').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('in-pass').focus()
  })
  document.getElementById('btn-logout').addEventListener('click', doLogout)

  /* автовход, если сессия есть */
  const sess = Auth.current()
  if (sess) enterApp(sess)

  console.info('%cESP Norms · Lite v1.0', 'color:#3b82f6;font-weight:bold', 'готов · норм в базе:', NORMS.length)
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init)
} else {
  init()
}
</script>
</body>
</html>
