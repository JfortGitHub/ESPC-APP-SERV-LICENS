<style>
:root{
  --bg:#111827;--panel:#1f2937;--panel2:#374151;
  --border:#374151;--border-soft:rgba(55,65,81,.6);--border-hi:#4b5563;
  --text:#e5e7eb;--muted:#9ca3af;--dim:#6b7280;
  --accent:#2563eb;--accent-h:#3b82f6;
  --green:#16a34a;--red:#dc2626;--yellow:#eab308;--purple:#a855f7;--cyan:#06b6d4;--orange:#f97316;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:calc(var(--vh, 1vh) * 100);overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;background:#111827;color:var(--text);-webkit-text-size-adjust:100%}
button,.btn,.nav-item,.tile,.chip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,.btn{outline:none}
input,select,textarea{-webkit-appearance:none;appearance:none;border-radius:9px}

/* ═══ LOGIN SCREEN ═══ */
.login-screen{
  position:fixed;inset:0;z-index:2000;
  background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,.18),transparent 55%),
             radial-gradient(ellipse at 70% 80%,rgba(168,85,247,.14),transparent 55%),
             #111827;
  display:flex;align-items:center;justify-content:center;
  padding:20px;padding-top:calc(20px + var(--sat,0));padding-bottom:calc(20px + var(--sab,0));
  animation:fadeIn .3s;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.login-box{
  background:#1f2937;border:1px solid var(--border-hi);border-radius:20px;
  padding:36px 32px;width:100%;max-width:420px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:slideUp .4s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.login-logo{
  width:72px;height:72px;border-radius:18px;margin:0 auto 18px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:36px;
  box-shadow:0 10px 32px rgba(37,99,235,.45);
}
.login-box h2{text-align:center;color:#fff;font-size:22px;font-weight:800;margin-bottom:6px}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;letter-spacing:.5px;text-transform:uppercase}
.login-box .sub b{color:#93c5fd}
.login-field{margin-bottom:14px;position:relative}
.login-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:6px}
.login-field input{
  width:100%;background:#111827;border:1px solid #4b5563;border-radius:10px;
  padding:11px 14px;color:#fff;font-size:16px;font-family:inherit;
  transition:border-color .15s;
}
.login-field input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.login-btn{
  width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
  font-size:15px;font-weight:700;font-family:inherit;margin-top:8px;
  transition:all .2s;
}
.login-btn:active{transform:scale(.98)}
.login-error{
  background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.4);
  color:#fca5a5;padding:10px 14px;border-radius:10px;font-size:12.5px;
  margin-bottom:14px;display:none;
}
.login-error.show{display:block;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-hint{
  margin-top:20px;padding-top:18px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--dim);text-align:center;line-height:1.7;
}
.login-hint b{color:#93c5fd;font-family:monospace;font-size:12px}
.login-accounts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.login-account{
  background:#111827;border:1px solid var(--border);border-radius:8px;
  padding:8px 6px;text-align:center;cursor:pointer;transition:all .15s;
}
.login-account:active{border-color:var(--accent-h);background:#1a2233}
.login-account .role{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.login-account .login-name{font-family:monospace;font-size:11.5px;color:#93c5fd;margin-top:2px}

/* ═══ APP ═══ */
.app{display:grid;grid-template-columns:290px 1fr;height:100vh;height:calc(var(--vh,1vh) * 100);overflow:hidden;padding-top:var(--sat,0);padding-left:var(--sal,0);padding-right:var(--sar,0)}
.app.hidden{display:none}
.sidebar{background:#1f2937;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1e3a8a,#312e81,#581c87)}
.brand-icon{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.4)}
.brand-text h1{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.brand-text p{font-size:11px;color:#93c5fd;margin-top:2px}
.nav-scroll{flex:1;overflow-y:auto;padding:12px 10px;-webkit-overflow-scrolling:touch}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-scroll::-webkit-scrollbar-thumb{background:#4b5563;border-radius:3px}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;padding:6px 10px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:#cbd5e1;font-size:13.5px;font-weight:500;transition:all .18s;margin-bottom:2px;border:1px solid transparent}
.nav-item:active{background:#334155;color:#fff}
.nav-item.active{background:#2563eb;color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
.nav-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .badge-n{margin-left:auto;background:rgba(37,99,235,.25);color:#93c5fd;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}
.nav-item.active .badge-n{background:rgba(255,255,255,.2);color:#fff}
.nav-item.admin-only{opacity:.5;pointer-events:none}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--dim);text-align:center;padding-bottom:calc(12px + var(--sab,0))}

.main{display:flex;flex-direction:column;overflow:hidden;position:relative;background:#111827}
.topbar{padding:12px 24px;padding-top:calc(12px + var(--sat,0));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:#1f2937;z-index:10;flex-wrap:wrap;gap:10px}
.topbar-title{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:15px;flex:1;min-width:200px}
.topbar-title .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user-badge{display:flex;align-items:center;gap:8px;background:#111827;border:1px solid var(--border);border-radius:10px;padding:6px 12px 6px 8px;font-size:12px}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.user-badge .uname{color:#fff;font-weight:600}
.user-badge .urole{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid transparent;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;background:#374151;color:#cbd5e1;font-family:inherit;white-space:nowrap;min-height:36px}
.btn:active{background:#4b5563;color:#fff;transform:scale(.97)}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:active{background:#1d4ed8;box-shadow:0 6px 18px rgba(37,99,235,.4)}
.btn-success{background:#16a34a;color:#fff}
.btn-success:active{background:#15803d;box-shadow:0 6px 18px rgba(22,163,74,.4)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:active{background:#374151;color:#fff}
.btn-danger{background:rgba(220,38,38,.15);color:#fca5a5;border-color:rgba(220,38,38,.35)}
.btn-danger:active{background:rgba(220,38,38,.3);color:#fff}
.btn-xs{padding:6px 10px;font-size:11.5px;border-radius:7px;min-height:30px}
.btn-ico{padding:8px;width:38px;min-height:38px;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}

.chat{flex:1;overflow-y:auto;padding:24px 24px 40px;padding-bottom:calc(40px + var(--sab,0));display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.msg{max-width:100%;display:flex;animation:slideIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bubble{background:#1f2937;border:1px solid var(--border);border-radius:14px;padding:16px 20px;font-size:14px;line-height:1.6;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.25);width:100%;max-width:1000px;word-wrap:break-word;overflow-wrap:break-word}
.bubble-title{color:#fff;font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bubble-sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
.bubble p{margin-bottom:8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{list-style:none;margin:6px 0}
.bubble li{padding:3px 0;font-size:13.5px;display:flex;gap:8px}
.bubble li::before{content:'▸';color:#60a5fa;flex-shrink:0}
.bubble code{font-family:'JetBrains Mono',monospace;background:#111827;padding:2px 6px;border-radius:4px;font-size:12.5px;color:#93c5fd;word-break:break-all}
.bubble .hl{color:#93c5fd;font-weight:600}
.tm-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(168,85,247,.15);color:#d8b4fe;padding:3px 8px;border-radius:6px;border:1px solid rgba(168,85,247,.3);display:inline-block;word-break:break-all}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;font-weight:600;border:1px solid}
.chip-blue{color:#93c5fd;border-color:rgba(59,130,246,.4);background:rgba(37,99,235,.15)}
.chip-green{color:#86efac;border-color:rgba(34,197,94,.4);background:rgba(22,163,74,.15)}
.chip-yellow{color:#fde047;border-color:rgba(234,179,8,.4);background:rgba(202,138,4,.15)}
.chip-red{color:#fca5a5;border-color:rgba(239,68,68,.4);background:rgba(220,38,38,.15)}
.chip-purple{color:#d8b4fe;border-color:rgba(168,85,247,.4);background:rgba(147,51,234,.15)}
.chip-orange{color:#fdba74;border-color:rgba(249,115,22,.4);background:rgba(234,88,12,.15)}
.chip-cyan{color:#67e8f9;border-color:rgba(6,182,212,.4);background:rgba(8,145,178,.15)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
@media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.tile{background:#111827;border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:all .2s}
.tile:active{border-color:var(--border-hi);transform:translateY(-1px)}
.tile-h{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.tile-v{font-size:22px;font-weight:800;color:#fff}
.tile-v.blue{color:#60a5fa}.tile-v.green{color:#4ade80}.tile-v.purple{color:#c084fc}
.tile-v.yellow{color:#facc15}.tile-v.red{color:#f87171}.tile-v.orange{color:#fb923c}
.tile-d{font-size:11.5px;color:var(--muted);margin-top:4px}

.norms-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#111827;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.search-inp{flex:1;min-width:200px;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:10px 14px;color:#fff;font-size:16px;font-family:inherit;transition:border-color .18s}
.search-inp:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.sel{background:#111827;border:1px solid #4b5563;border-radius:8px;padding:9px 12px;color:#cbd5e1;font-size:13px;font-family:inherit;cursor:pointer;min-height:38px}
.sel:focus{outline:none;border-color:#3b82f6}
.norm-row{background:#111827;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:all .2s}
.norm-row:active{border-color:var(--border-hi);background:#1a2233}
.norm-row-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.norm-row-info{flex:1;min-width:200px}
.norm-row-code{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#93c5fd;font-weight:600;word-break:break-all}
.norm-row-name{color:#fff;font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.35}
.norm-row-eq{color:var(--muted);font-size:11.5px;margin-top:3px}
.norm-row-tm{margin-top:5px}
.norm-row-stats{display:flex;gap:16px;align-items:center;flex-shrink:0}
.norm-stat{text-align:center}
.norm-stat-v{font-size:18px;font-weight:800;color:#fff;line-height:1}
.norm-stat-l{font-size:10px;color:var(--dim);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
.norm-row-actions{display:flex;gap:6px;flex-shrink:0;align-items:center}

.calc-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:900px){.calc-wrap{grid-template-columns:1fr}}
.calc-list{background:#111827;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.calc-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);font-size:13px}
.calc-item:last-child{border-bottom:none}
.calc-item-name{flex:1;min-width:0;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-item-meta{font-size:11px;color:var(--dim)}
.qty-btn{width:32px;height:32px;border-radius:7px;background:#374151;color:#fff;border:none;cursor:pointer;font-size:16px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:all .15s}
.qty-btn:active{background:#2563eb;transform:scale(.92)}
.qty-val{color:#fff;font-weight:700;width:32px;text-align:center;font-size:14px}
.calc-del{background:none;border:none;color:var(--dim);cursor:pointer;padding:6px;font-size:16px;transition:color .15s;min-height:32px;min-width:32px}
.calc-del:active{color:#f87171}
.calc-summary{background:#111827;padding:14px;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.calc-sidebar{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;position:sticky;top:10px;height:fit-content}

.stat-bar{margin-bottom:10px}
.stat-bar-h{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.stat-bar-name{color:var(--muted)}
.stat-bar-v{color:#fff;font-weight:700}
.stat-bar-track{height:8px;background:#374151;border-radius:4px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.16,1,.3,1)}

.tech-card{background:#111827;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;transition:all .2s}
.tech-card:active{border-color:var(--border-hi);transform:translateY(-1px)}
.tech-card-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.tech-card-num{font-family:'JetBrains Mono',monospace;color:#93c5fd;font-size:12.5px;font-weight:700}
.tech-card-title{color:#fff;font-size:15px;font-weight:700;margin-top:4px}
.tech-card-meta{color:var(--muted);font-size:12px;margin-top:4px}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;padding-top:calc(20px + var(--sat,0));padding-bottom:calc(20px + var(--sab,0));animation:fadeIn .2s;overflow-y:auto;-webkit-overflow-scrolling:touch}
@supports (-webkit-backdrop-filter: blur(6px)) or (backdrop-filter: blur(6px)){
  .modal-ov{background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
}
.modal{background:#1f2937;border:1px solid var(--border-hi);border-radius:16px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:slideIn .3s cubic-bezier(.16,1,.3,1);-webkit-overflow-scrolling:touch}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#1f2937;z-index:5}
.modal-title{color:#fff;font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:6px;min-height:36px;min-width:36px}
.modal-close:active{color:#fff}
.modal-body{padding:20px 22px}

.form-group{margin-bottom:14px}
.form-lbl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-inp,.form-sel,.form-ta{width:100%;background:#111827;border:1px solid #4b5563;border-radius:9px;padding:10px 12px;color:#fff;font-size:16px;font-family:inherit;transition:border-color .15s}
.form-inp:focus,.form-sel:focus,.form-ta:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.form-inp.err,.form-sel.err{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.form-inp.ok{border-color:#16a34a}
.form-inp.tm{font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.form-ta{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.form-sec-title{color:#fff;font-weight:700;font-size:13px;margin:18px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.form-hint{font-size:11px;color:var(--dim);margin-top:4px}
.form-hint.err{color:#fca5a5}
.form-hint.ok{color:#86efac}

.warn-banner{background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.4);color:#fde047;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.warn-banner.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#86efac}

const PWD_SALT = 'esp-norm-salt-v1';

async function sha256Hex(data){
  const buf = new TextEncoder().encode(data);
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fnvIterHex(data){
  let h = 2166136261 >>> 0;
  for(let round=0; round<10000; round++){
    for(let i=0;i<data.length;i++){
      h ^= data.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
  }
  return h.toString(16).padStart(8,'0');
}
async function hashPwd(pwd){
  const data = PWD_SALT + '::' + pwd;
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    try{ return 'sha256:' + await sha256Hex(data); }catch(e){}
  }
  return 'fnv:' + fnvIterHex(data);
}
async function verifyPwd(pwd, storedHash){
  if(!storedHash) return false;
  const data = PWD_SALT + '::' + pwd;
  if(storedHash.startsWith('sha256:')){
    if(!window.crypto || !crypto.subtle) return false;
    try{ return ('sha256:' + await sha256Hex(data)) === storedHash; }catch(e){ return false; }
  }
  if(storedHash.startsWith('fnv:')){ return ('fnv:' + fnvIterHex(data)) === storedHash; }
  return false;
}
function isHashed(h){ return typeof h === 'string' && (h.startsWith('sha256:') || h.startsWith('fnv:')); }

async function migratePasswords(){
  let changed = false;
  for(const u of AUTH.users){
    if(!u.password || isHashed(u.password)) continue;
    u.password = await hashPwd(u.password);
    changed = true;
  }
  if(changed){ saveUsers(); console.log('[ESP] Пароли переведены в хеши (' + AUTH.users.length + ' записей)'); }
}

async function tryLogin(login, password){
  const u = AUTH.users.find(x => x.login === login);
  if(!u) return false;
  const ok = await verifyPwd(password, u.password);
  if(!ok) return false;
  AUTH.session = {login:u.login, name:u.name, role:u.role, loginTime:new Date().toISOString()};
  SS.setItem('esp_session', JSON.stringify(AUTH.session));
  return true;
}
function restoreSession(){
  const s = SS.getItem('esp_session');
  if(s){ try{ AUTH.session = JSON.parse(s); return true }catch(e){} }
  return false;
}

  if(!confirm('Выйти из системы?')) return;

/* ═══ TM ═══ */
const TM_PREFIX = '1201';
function validateTM(tm){
  if(!tm) return {ok:true, msg:'Поле необязательное', empty:true};
  const parts = tm.split('-');
  if(parts.length !== 7) return {ok:false, msg:`Ожидается 7 групп, получено ${parts.length}`};
  if(parts[0] !== TM_PREFIX) return {ok:false, msg:`Префикс должен быть ${TM_PREFIX}`};
  for(let i=1;i<7;i++){ if(!/^\d{3}$/.test(parts[i])) return {ok:false, msg:`Группа ${i}: 3 цифры`}; }
  return {ok:true, msg:'Формат корректен'};
}
function autoFormatTM(input){
  let v = input.value.replace(/[^\d]/g,'');
  if(v.length > 22) v = v.slice(0,22);
  let formatted = '';
  if(v.length === 0){ input.value=''; return; }
  if(v.length <= 4){ formatted = v; }
  else { formatted = v.slice(0,4); for(let i=4;i<v.length;i+=3){ formatted += '-' + v.slice(i, i+3); } }
  input.value = formatted;
}

  custom: JSON.parse(LS.getItem('esp_custom')||'[]'),

};
function allNorms(){ return [...BASE_NORMS, ...state.custom]; }

function getFiltered(){
  return allNorms().filter(n=>{
    const s=state.search.toLowerCase().trim();
    const mS = !s || n.operationName.toLowerCase().includes(s) || n.equipmentType.toLowerCase().includes(s) || n.operationCode.toLowerCase().includes(s) || (n.tm&&n.tm.toLowerCase().includes(s));
    return mS && (!state.fSection || n.section===state.fSection) && (!state.fCat || n.equipmentCategory===state.fCat) && (!state.fRep || n.repairType===state.fRep) && (!state.fSrc || n.sourceType===state.fSrc);

/* ═══ RENDER ═══ */
function appendMsg(html, delay=0){
  return new Promise(res=>{
    setTimeout(()=>{
      const chat = document.getElementById('chat');
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.innerHTML = `<div class="bubble">${html}</div>`;
      chat.appendChild(msg);
      try{ chat.scrollTop = chat.scrollHeight; }catch(e){}
      if(window.__ESP_MOBILE && window.__ESP_MOBILE.isIOS){
        try{ msg.scrollIntoView({block:'end', behavior:'auto'}); }catch(e){}
      }
      res();
    }, delay);
  });
}

function renderChat(){
  const chat = document.getElementById('chat');
  chat.innerHTML='';
  const titleMap = {
    normatives:'Нормативы', calculator:'Калькулятор', cards:'Тех. карты',

    equipment:'Оборудование', about:'О версии', settings:'Пользователь', users:'Пользователи'

}

  ['f-sec|fSection','f-cat|fCat','f-rep|fRep','f-src|fSrc'].forEach(p=>{

        <div><div class="norm-stat-v" style="color:#60a5fa">${days}</div><div class="norm-stat-l">дней</div></div>
        <div><div class="norm-stat-v" style="color:#c084fc">${avgTeam}</div><div class="norm-stat-l">бригада</div></div>

function attachCalcEvents(){
  const s = document.getElementById('calc-srch');
  if(s) s.oninput = e=>{ state.calcSearch=e.target.value; refreshCalcOps(); };
  bindCalcEvents();
}
function refreshCalcOps(){
  const box = document.getElementById('calcOpsBox');
  if(box){ box.innerHTML = renderCalcOps(); bindCalcOpsEvents(); }
}
function refreshCalcSidebar(){
  const sb = document.getElementById('calcSidebar');
  if(sb){ sb.innerHTML = renderCalcSidebar(); bindCalcEvents(); }
}
function bindCalcOpsEvents(){
  document.querySelectorAll('#calcOpsBox [data-calc-add]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.calcAdd;
      const norm=allNorms().find(n=>n.id===id);
      if(!state.calc.find(c=>c.norm.id===id)) state.calc.push({norm,qty:1});
      refreshCalcOps(); refreshCalcSidebar();
    };
  });
}
function bindCalcEvents(){
  const clr = document.getElementById('calcClear');
  if(clr) clr.onclick = ()=>{ state.calc=[]; refreshCalcOps(); refreshCalcSidebar(); };
  const crt = document.getElementById('calcCreate');
  if(crt) crt.onclick = showCreateCardModal;
  const exp = document.getElementById('calcExport');
  if(exp) exp.onclick = exportCsv;
  document.querySelectorAll('#calcSidebar [data-qm]').forEach(b=>b.onclick=()=>{
    const it=state.calc.find(c=>c.norm.id===b.dataset.qm); if(it&&it.qty>1) it.qty--;
    refreshCalcOps(); refreshCalcSidebar();
  });
  document.querySelectorAll('#calcSidebar [data-qp]').forEach(b=>b.onclick=()=>{
    const it=state.calc.find(c=>c.norm.id===b.dataset.qp); if(it) it.qty++;
    refreshCalcOps(); refreshCalcSidebar();
  });
  document.querySelectorAll('#calcSidebar [data-rm]').forEach(b=>b.onclick=()=>{
    state.calc = state.calc.filter(c=>c.norm.id!==b.dataset.rm);
    refreshCalcOps(); refreshCalcSidebar();
  });
}

        <div class="form-group"><label class="form-lbl">Сложность</label><select class="form-sel" name="complexity">${[1,2,3,4,5].map(i=>`<option value="${i}" ${i===3?'selected':''}>${i}</option>`).join('')}</select></div>

      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Тип</label><select class="form-sel" name="sourceType">${Object.entries(SOURCE_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="form-group"><label class="form-lbl">Код</label><input class="form-inp" name="sourceCode"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Достоверность</label><input class="form-inp" type="number" name="confidenceLevel" value="0.85" min="0" max="1" step="0.05" inputmode="decimal"></div>
        <div class="form-group"><label class="form-lbl">Описание</label><input class="form-inp" name="description"></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap">
        <button type="button" class="btn btn-ghost" id="addFormReset">Сбросить</button>
        <button type="submit" class="btn btn-primary">💾 Сохранить</button>
      </div>
    </form>`).then(()=>{
    const form = document.getElementById('addForm');
    const tmInp = document.getElementById('tmInput');
    const tmHint = document.getElementById('tmHint');
    const defHint = 'Формат: <code>1201-XXX-XXX-XXX-XXX-XXX-XXX</code>. Необязательно.';
    tmInp.addEventListener('input', ()=>{
      autoFormatTM(tmInp);
      const v = tmInp.value.trim();
      if(!v){ tmInp.classList.remove('err','ok'); tmHint.className='form-hint'; tmHint.innerHTML=defHint; return; }
      const r = validateTM(v);
      if(r.ok){ tmInp.classList.add('ok'); tmInp.classList.remove('err'); tmHint.className='form-hint ok'; tmHint.textContent='✓ '+r.msg; }
      else { tmInp.classList.add('err'); tmInp.classList.remove('ok'); tmHint.className='form-hint err'; tmHint.textContent='✕ '+r.msg; }
    });
    form.querySelector('#addFormReset').onclick = ()=>{
      form.reset();
      tmInp.classList.remove('err','ok');
      tmHint.className='form-hint';
      tmHint.innerHTML=defHint;
      document.getElementById('addFormWarn').innerHTML='';
    };
    form.onsubmit = e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const tmValue = (fd.get('tm')||'').trim();
      if(tmValue){
        const r = validateTM(tmValue);
        if(!r.ok){ document.getElementById('addFormWarn').innerHTML = `<div class="warn-banner err">✕ ТМ-код: ${r.msg}</div>`; return; }
      }
      const nv = parseFloat(fd.get('normValue'));
      if(!isFinite(nv) || nv <= 0){
        document.getElementById('addFormWarn').innerHTML = '<div class="warn-banner err">✕ Норматив должен быть положительным</div>';
        return;
      }
      const code = (fd.get('operationCode')||'').trim();
      const dupCode = allNorms().find(n=>n.operationCode.toLowerCase() === code.toLowerCase());
      if(dupCode){
        if(!confirm(`Код "${code}" уже существует:\n"${dupCode.operationName}"\n\nВсё равно добавить?`)) return;
      }
      const norm = {
        id:'custom-'+Date.now(),
        operationCode:code, operationName:fd.get('operationName'),
        section:fd.get('section'), equipmentCategory:fd.get('equipmentCategory'),
        equipmentType:fd.get('equipmentType'), equipmentUnit:fd.get('equipmentUnit')||'',
        normValue:nv, unit:'чел-час',
        teamSize:parseInt(fd.get('teamSize'))||1, qualification:fd.get('qualification')||'',
        complexity:parseInt(fd.get('complexity'))||3,
        sourceType:fd.get('sourceType'), sourceCode:fd.get('sourceCode')||'',
        sourceTitle:fd.get('sourceTitle')||'',
        confidenceLevel:parseFloat(fd.get('confidenceLevel'))||0.7,
        repairType:fd.get('repairType'),
        toolsRequired:[], safetyRequirements:[],
        description:fd.get('description')||'', actualAvg:undefined, deviationPct:0,
        tm:tmValue, isCustom:true,
        author:AUTH.session?.login||'unknown',
        createdAt:new Date().toISOString()
      };
      state.custom.push(norm); saveCustom();
      appendMsg(`<div class="bubble-title">✅ Норматив добавлен</div>
        <p>Код: <code>${norm.operationCode}</code><br>
        Операция: <b>${norm.operationName}</b><br>
        Норматив: <span class="hl">${norm.normValue} чел-час</span>${norm.tm?`<br>ТМ: <span class="tm-code">${norm.tm}</span>`:''}</p>
        <p style="color:var(--muted);font-size:12px">Всего пользовательских: ${state.custom.length}</p>`);
      form.reset();
      tmInp.classList.remove('err','ok');
      tmHint.className='form-hint';
      tmHint.innerHTML=defHint;
      document.getElementById('addFormWarn').innerHTML='';
    };
  });
}

      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Новый (мин. 6)</label><input class="form-inp" type="password" name="newPwd" minlength="6" required autocomplete="new-password"></div>
        <div class="form-group"><label class="form-lbl">Повторите</label><input class="form-inp" type="password" name="newPwd2" minlength="6" required autocomplete="new-password"></div>
      </div>
      <div id="pwdMsg"></div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="submit" class="btn btn-primary">🔐 Сменить</button></div>
    </form>
    <div class="form-sec-title" style="margin-top:20px">💾 Резервное копирование</div>
    <div class="grid2">
      <div class="tile"><div class="tile-h">Экспорт JSON</div><div class="tile-d" style="margin-bottom:10px">Скачать все данные</div><button class="btn btn-success btn-xs" id="expAll">📥 Скачать</button></div>
      <div class="tile"><div class="tile-h">Импорт JSON</div><div class="tile-d" style="margin-bottom:10px">Загрузить ранее сохранённое</div><input type="file" id="impFile" accept=".json" style="display:none"><button class="btn btn-ghost btn-xs" id="impBtn">📤 Загрузить</button></div>
    </div>
    <div class="form-sec-title" style="margin-top:20px">📊 Сводка</div>
    <div class="grid3">
      <div class="tile" style="text-align:center"><div class="tile-v blue">${state.custom.length}</div><div class="tile-d">Ваших нормативов</div></div>
      <div class="tile" style="text-align:center"><div class="tile-v green">${state.customEquip.length}</div><div class="tile-d">Оборудования</div></div>
      <div class="tile" style="text-align:center"><div class="tile-v purple">${state.cards.length}</div><div class="tile-d">Техкарт</div></div>
    </div>
    <div class="form-sec-title" style="margin-top:20px">🗑 Очистка</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-danger btn-xs" id="clearCustom">Нормативы</button>
      <button class="btn btn-danger btn-xs" id="clearEquip">Оборудование</button>
      <button class="btn btn-danger btn-xs" id="clearCards">Техкарты</button>
    </div>
  `).then(()=>{
    document.getElementById('pwdForm').onsubmit = async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById('pwdMsg');
      const u = AUTH.users.find(x=>x.login === s.login);
      if(!u){ msg.innerHTML = '<div class="warn-banner err">✕ Не найден</div>'; return; }
      const ok = await verifyPwd(fd.get('oldPwd'), u.password);
      if(!ok){ msg.innerHTML = '<div class="warn-banner err">✕ Текущий пароль неверен</div>'; return; }
      if(fd.get('newPwd') !== fd.get('newPwd2')){ msg.innerHTML = '<div class="warn-banner err">✕ Не совпадают</div>'; return; }
      if(fd.get('newPwd').length < 6){ msg.innerHTML = '<div class="warn-banner err">✕ Минимум 6</div>'; return; }
      u.password = await hashPwd(fd.get('newPwd')); saveUsers();
      msg.innerHTML = '<div class="warn-banner ok">✓ Пароль изменён</div>';
      e.target.reset();
    };
    document.getElementById('expAll').onclick = ()=>{

    };
    document.getElementById('impBtn').onclick = ()=>document.getElementById('impFile').click();
    document.getElementById('impFile').onchange = (ev)=>{
      const file = ev.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!confirm(`Импортировать?\nНормативов: ${(data.custom||[]).length}\nОборудования: ${(data.customEquip||[]).length}\nТехкарт: ${(data.cards||[]).length}`)) return;
          state.custom = data.custom||[]; saveCustom();
          state.customEquip = data.customEquip||[]; saveEquip();
          state.cards = data.cards||[]; saveCards();
          alert('Импорт выполнен'); renderChat();
        }catch(e){ alert('Ошибка: '+e.message); }
      };
      reader.readAsText(file); ev.target.value='';
    };
    document.getElementById('clearCustom').onclick = ()=>{ if(confirm('Удалить?')){state.custom=[]; saveCustom(); renderChat();} };
    document.getElementById('clearEquip').onclick = ()=>{ if(confirm('Удалить?')){state.customEquip=[]; saveEquip(); renderChat();} };
    document.getElementById('clearCards').onclick = ()=>{ if(confirm('Удалить?')){state.cards=[]; saveCards(); renderChat();} };
  });
}

        <div class="form-group"><label class="form-lbl">Логин *</label><input class="form-inp" name="login" required pattern="[a-zA-Z0-9_]{3,20}" autocapitalize="off" spellcheck="false"></div>
        <div class="form-group"><label class="form-lbl">ФИО *</label><input class="form-inp" name="name" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-lbl">Пароль *</label><input class="form-inp" type="password" name="password" minlength="6" required></div>
        <div class="form-group"><label class="form-lbl">Роль *</label><select class="form-sel" name="role"><option value="user">Пользователь</option><option value="engineer">Инженер</option><option value="admin">Администратор</option></select></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px"><button type="submit" class="btn btn-primary">➕ Добавить</button></div>
    </form>
  `).then(()=>{
    document.querySelectorAll('[data-del-user]').forEach(b=>b.onclick=()=>{
      if(!confirm(`Удалить "${b.dataset.delUser}"?`)) return;
      AUTH.users = AUTH.users.filter(u=>u.login !== b.dataset.delUser);
      saveUsers(); renderChat();
    });
    document.querySelectorAll('[data-reset-pwd]').forEach(b=>b.onclick=async ()=>{
      const np = prompt(`Новый пароль для "${b.dataset.resetPwd}" (мин. 6):`);
      if(np === null) return;
      if(np.length < 6){ alert('Минимум 6'); return; }
      const u = AUTH.users.find(x=>x.login === b.dataset.resetPwd);
      if(!u){ alert('Не найден'); return; }
      u.password = await hashPwd(np); saveUsers();
      alert(`Пароль для "${b.dataset.resetPwd}" изменён.`); renderChat();
    });
    document.getElementById('addUserForm').onsubmit = async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const login = fd.get('login').trim();
      if(AUTH.users.find(u=>u.login === login)){ alert('Уже существует'); return; }
      AUTH.users.push({ login, password: await hashPwd(fd.get('password')), name: fd.get('name'), role: fd.get('role'), createdAt: new Date().toISOString() });
      saveUsers(); alert(`Пользователь "${login}" добавлен`); renderChat();
    };
  });
}

      <td style="padding:8px 12px;color:#fff">${n.operationName}${n.tm?`<br><span class="tm-code" style="font-size:9.5px;margin-top:3px">${n.tm}</span>`:''}</td>

            <thead><tr style="background:#374151;color:var(--muted);font-size:11px;text-transform:uppercase">
              <th style="padding:8px 12px;text-align:left">№</th><th style="padding:8px 12px;text-align:left">Код</th>
              <th style="padding:8px 12px;text-align:left">Операция</th><th style="padding:8px 12px;text-align:center">Норма</th>

      </div>

  document.body.appendChild(m);
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>m.remove());

function generateCardText(card){
  const ops = card.operations.map((op,i)=>{
    const n = allNorms().find(x=>x.id===op.normativeId);
    return n?`${i+1}. ${n.operationCode} | ${n.operationName} | ${n.normValue} × ${op.quantity} = ${n.normValue*op.quantity} чел-час${n.tm?' | ТМ: '+n.tm:''}`:'';
  }).filter(Boolean).join('\n');
  return `ТЕХНОЛОГИЧЕСКАЯ КАРТА\n${card.cardNumber}\nОборудование: ${card.equipmentName}\n${card.tm?'ТМ: '+card.tm+'\n':''}Тип ремонта: ${REPAIR_NAMES[card.repairType]}\nДата: ${new Date(card.createdAt).toLocaleDateString('ru-RU')}\nАвтор: ${card.author||'—'}\n\n${ops}\n\nИТОГО: ${card.totalHours} чел-час\nДней: ${card.calendarDays}`;
}
function printCard(card){
  if(!card) return;
  const rows = card.operations.map((op,i)=>{
    const n = allNorms().find(x=>x.id===op.normativeId);
    if(!n) return '';
    return `<tr><td style="border:1px solid #333;padding:5px;text-align:center">${i+1}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:10px">${n.operationCode}</td><td style="border:1px solid #333;padding:5px">${n.operationName}</td><td style="border:1px solid #333;padding:5px;font-family:monospace;font-size:9px">${n.tm||'—'}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.normValue}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.unit}</td><td style="border:1px solid #333;padding:5px;text-align:center">${op.quantity}</td><td style="border:1px solid #333;padding:5px;text-align:center;font-weight:bold">${n.normValue*op.quantity}</td><td style="border:1px solid #333;padding:5px;text-align:center">${n.teamSize}</td><td style="border:1px solid #333;padding:5px;font-size:10px">${n.qualification}</td></tr>`;
  }).filter(Boolean).join('');
  const w = window.open('','_blank');
  if(!w){ alert('Разрешите всплывающие окна для печати'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТК ${card.cardNumber}</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;font-size:10pt;color:#000}.header{text-align:center;margin-bottom:16px;border-bottom:2px solid #000;padding-bottom:8px}.header h1{font-size:15pt;margin:0}.header h2{font-size:12pt;margin:4px 0 0;font-weight:normal}table{width:100%;border-collapse:collapse;margin:12px 0;font-size:9.5pt}th{background:#e5e7eb;border:1px solid #333;padding:5px;font-weight:bold;text-align:center}.total-row{background:#f3f4f6;font-weight:bold}.signatures{display:flex;justify-content:space-between;margin-top:36px;gap:12px}.signature{flex:1}.signature-line{border-bottom:1px solid #000;margin-top:28px;padding-top:4px;font-size:8pt}.no-print{text-align:center;margin-bottom:16px}.no-print button{padding:10px 20px;font-size:14px;cursor:pointer;border:none;border-radius:5px;margin:0 4px;background:#2563eb;color:#fff}@media print{.no-print{display:none}}</style></head><body><div class="no-print"><button onclick="window.print()">🖨 Печать</button></div><div class="header"><h1>ТЕХНОЛОГИЧЕСКАЯ КАРТА</h1><h2>${card.cardNumber}</h2></div><div style="margin:12px 0"><div><strong>Оборудование:</strong> ${card.equipmentName}</div>${card.tm?`<div><strong>ТМ:</strong> ${card.tm}</div>`:''}<div><strong>Тип:</strong> ${REPAIR_NAMES[card.repairType]}</div><div><strong>Дата:</strong> ${new Date(card.createdAt).toLocaleDateString('ru-RU')}</div><div><strong>Автор:</strong> ${card.author||'—'}</div></div><table><thead><tr><th>№</th><th>Код</th><th>Операция</th><th>ТМ</th><th>Норма</th><th>Ед.</th><th>Кол-во</th><th>Итого</th><th>Бриг.</th><th>Разряд</th></tr></thead><tbody>${rows}</tbody><tfoot><tr class="total-row"><td colspan="7" style="text-align:right;border:1px solid #333;padding:7px">ИТОГО:</td><td style="text-align:center;border:1px solid #333;padding:7px;font-size:11pt">${card.totalHours} чел-час</td><td colspan="2" style="text-align:center;border:1px solid #333;padding:7px">Дней: ${card.calendarDays}</td></tr></tfoot></table><div class="signatures"><div class="signature"><div class="signature-line">Разработал</div></div><div class="signature"><div class="signature-line">Согласовал</div></div><div class="signature"><div class="signature-line">Утвердил</div></div></div></body></html>`);
  w.document.close();
}
function downloadFile(name, content, type){
  try{
    const b = new Blob([content], {type:type+';charset=utf-8;'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href=u; a.download=name;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(u); }catch(e){} }, 100);
  }catch(e){ alert('Не удалось скачать файл: ' + e.message); }
}
function exportCsv(){
  if(!state.calc.length){ alert('Калькулятор пуст'); return; }
  const h = ['Код','Операция','ТМ','Норматив','Кол-во','Итого'];
  const rows = state.calc.map(i=>[i.norm.operationCode, i.norm.operationName, i.norm.tm||'', i.norm.normValue, i.qty, i.norm.normValue*i.qty]);
  const csv = [h,...rows].map(r=>r.join(';')).join('\n');
  downloadFile(`расчёт_${new Date().toISOString().slice(0,10)}.csv`, '\uFEFF'+csv, 'text/csv');
}
